name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - ios-simulator
          - preview
          - production
      platform:
        description: Target platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in repository Actions secrets."
            exit 1
          fi
          eas whoami

      - name: Install dependencies
        run: npm ci

      - name: Trigger EAS build and wait for completion
        run: eas build --non-interactive --wait --json --profile "${{ inputs.profile }}" --platform "${{ inputs.platform }}" > eas-build.json

      - name: Extract Android APK URL
        id: apk
        if: inputs.platform == 'android' && inputs.profile == 'preview'
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('eas-build.json', 'utf8').trim());
          const builds = Array.isArray(parsed) ? parsed : [parsed];
          const android = builds.find((build) => String(build.platform).toLowerCase() === 'android');
          const url = android?.artifacts?.buildUrl || android?.artifacts?.applicationArchiveUrl || '';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          EOF

      - name: Extract iOS archive URL
        id: ios
        if: inputs.platform == 'ios'
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('eas-build.json', 'utf8').trim());
          const builds = Array.isArray(parsed) ? parsed : [parsed];
          const ios = builds.find((build) => String(build.platform).toLowerCase() === 'ios');
          const url = ios?.artifacts?.buildUrl || ios?.artifacts?.applicationArchiveUrl || '';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          EOF

      - name: Download APK from EAS
        if: steps.apk.outputs.url != ''
        env:
          APK_URL: ${{ steps.apk.outputs.url }}
        run: curl --fail --location --retry 3 "$APK_URL" --output sub2api-mobile.apk

      - name: Upload APK artifact
        if: steps.apk.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-mobile-apk-${{ github.run_number }}
          path: sub2api-mobile.apk
          retention-days: 30

      - name: Download iOS simulator build from EAS
        if: steps.ios.outputs.url != '' && inputs.profile == 'ios-simulator'
        env:
          IOS_URL: ${{ steps.ios.outputs.url }}
        run: curl --fail --location --retry 3 "$IOS_URL" --output sub2api-ios-simulator.tar.gz

      - name: Upload iOS simulator artifact
        if: steps.ios.outputs.url != '' && inputs.profile == 'ios-simulator'
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-ios-simulator-${{ github.run_number }}
          path: sub2api-ios-simulator.tar.gz
          retention-days: 30

      - name: Download signed iOS IPA from EAS
        if: steps.ios.outputs.url != '' && inputs.profile != 'ios-simulator'
        env:
          IOS_URL: ${{ steps.ios.outputs.url }}
        run: curl --fail --location --retry 3 "$IOS_URL" --output sub2api.ipa

      - name: Upload signed iOS IPA artifact
        if: steps.ios.outputs.url != '' && inputs.profile != 'ios-simulator'
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-ios-ipa-${{ github.run_number }}
          path: sub2api.ipa
          retention-days: 30

      - name: Publish build links in workflow summary
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const raw = fs.readFileSync('eas-build.json', 'utf8').trim();
          const parsed = JSON.parse(raw);
          const builds = Array.isArray(parsed) ? parsed : [parsed];

          const lines = [];
          for (const build of builds) {
            const platform = String(build.platform || 'unknown').toUpperCase();
            const detailsUrl = build.buildDetailsPageUrl || build.detailsPageUrl || build.url;
            const downloadUrl = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;

            if (detailsUrl) {
              lines.push(`- ${platform} details: ${detailsUrl}`);
            }
            if (downloadUrl) {
              lines.push(`- ${platform} download: ${downloadUrl}`);
            }
          }

          const summary = [
            '## EAS Build Results',
            '',
            ...(lines.length > 0 ? lines : ['- Build finished, but no URLs were returned by EAS CLI.'])
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          EOF
